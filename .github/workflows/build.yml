name: Taoyao GPU 700-812MHz + Audio Fix Final
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Minimal Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev lz4 clang lld llvm

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Patch GPU Speed-Bin 0 & Enable Audio
        run: |
          cd kernel-src
          python3 -c '
          import re
          with open("drivers/gpu/msm/adreno.c", "r") as f:
              text = f.read()

          def repl(m):
              full = m.group(0)
              arg = m.group(1).strip()
              if arg.startswith("&"):
                  fix = arg[1:].strip() + " = 0;"
              else:
                  fix = "*" + arg + " = 0;"
              return full + "\n\t" + fix

          new_text = re.sub(
              r"of_property_read_u32\s*\([^,]+,\s*\"qcom,speed-bin\"\s*,\s*([^)]+)\)\s*;",
              repl,
              text,
              flags=re.DOTALL
          )
          with open("drivers/gpu/msm/adreno.c", "w") as f:
              f.write(new_text)
          '
          git diff drivers/gpu/msm/adreno.c
          git diff --exit-code drivers/gpu/msm/adreno.c && exit 1 || echo "MUVAFFAQIYATLI: Speed-Bin 0 patchi C sintaksisi bilan mos tushdi!"

          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Final Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image

      - name: Upload Final Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu812-audiofix-final
          path: kernel-src/out/arch/arm64/boot/Image
