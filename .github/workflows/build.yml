.github/workflows/build.yml
name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Compile Android 14 Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com
          kernel-branch: android-14
          config: taoyao_defconfig
          arch: arm64
          android-version: 14
          aosp-clang: true
          aosp-clang-version: r450784d
          ksu: true
          extra-cmd: LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          
