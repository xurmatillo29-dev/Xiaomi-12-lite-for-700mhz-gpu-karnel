name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libpcre3-dev o'rniga libpcre2-dev va boshqa kerakli paketlar o'rnatiladi
          sudo apt-get install -y bc bison build-essential ccache crypto-dev curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.2 https://github.com kernel-src

      - name: Clone Toolchains (Clang)
        run: |
          git clone --depth=1 https://gitlab.com $HOME/clang

      - name: Build Kernel
        run: |
          cd kernel-src
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Out papkasini yaratish va defconfig sozlash
          make O=out taoyao_defconfig
          
          # Kompilyatsiyani boshlash
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Output (ZImage / Boot)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-taoyao
          path: kernel-src/out/arch/arm64/boot/Image*
