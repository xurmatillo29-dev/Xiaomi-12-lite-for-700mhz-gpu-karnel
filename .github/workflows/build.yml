name: EvolutionX 5.4.259 Taoyao GPU 670MHz Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Minimal Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev lz4 clang lld llvm

      - name: Clone Official EvolutionX Taoyao Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_xiaomi_taoyao
          path: kernel-src

      - name: Patch GPU 550MHz to 670MHz (Bin 117 Safe)
        run: |
          cd kernel-src
          python3 -c '
          import re
          with open("drivers/gpu/msm/adreno.c", "r") as f:
              text = f.read()

          new_text = re.sub(
              r"(of_property_read_u32\s*\([^,]+,\s*\"qcom,gpu-freq\"\s*,\s*&([^)]+)\)\s*;)",
              r"\1\n\t\tif (\2 == 550000000) \2 = 670000000;",
              text,
              flags=re.DOTALL
          )

          with open("drivers/gpu/msm/adreno.c", "w") as f:
              f.write(new_text)
          '
          git diff drivers/gpu/msm/adreno.c
          git diff --exit-code drivers/gpu/msm/adreno.c && exit 1 || echo "MUVAFFAQIYATLI: 550MHz -> 670MHz patchi tushdi!"

      - name: Build EvolutionX Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1

          # Asosiy lahaina-qgki_defconfig va taoyao fragmentini birlashtirish:
          BASE_CFG=$(find arch/arm64/configs -name "lahaina-qgki_defconfig" | head -n 1)
          TAOYAO_CFG=$(find arch/arm64/configs -name "*taoyao*defconfig" | head -n 1)
          echo "Asosiy config: $BASE_CFG | Qurilma config: $TAOYAO_CFG"

          ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out $BASE_CFG $TAOYAO_CFG
          scripts/config --file out/.config \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS
          make -j$(nproc --all) O=out olddefconfig
          make -j$(nproc --all) O=out NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image

      - name: Upload EvolutionX Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: evolutionx-taoyao-gpu670-image
          path: kernel-src/out/arch/arm64/boot/Image
