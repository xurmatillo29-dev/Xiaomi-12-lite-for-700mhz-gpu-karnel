name: Xiaomi 12 Lite Android 14 GPU 700-812MHz Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip unzip zlib1g-dev clang lld llvm device-tree-compiler python3

      - name: Clone Android 14 Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-21.0
          path: kernel-src

      - name: Unlock Speed-Bin 0 (700MHz & 812MHz) & Audio Fix
        run: |
          cd kernel-src
          # GPU Speed Bin eFuse tekshiruvini 0 ga o'tkazish (700MHz va 812MHz zavod jadvalini ochadi)
          python3 -c '
          import glob, re
          for path in glob.glob("drivers/gpu/msm/*.c"):
              with open(path, "r") as f:
                  content = f.read()
              if "speed_bin" in content and "nvmem" in content:
                  new_content = re.sub(
                      r"(of_property_read_u32\([^;]+?\"qcom,speed-bin\"[^;]+?;)",
                      r"\1\n\t*speed_bin = 0;",
                      content
                  )
                  new_content = re.sub(
                      r"(adreno_read_speed_bin\([^)]+\)\s*\{)",
                      r"\1\n\treturn 0;",
                      new_content
                  )
                  if new_content != content:
                      with open(path, "w") as f:
                          f.write(new_content)
                      print("SPEED BIN UNLOCKED IN:", path)
          '

          # Audio va modul mosligi
          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Android 14 Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image

      - name: Upload Final Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-a14-gpu-unlocked
          path: kernel-src/out/arch/arm64/boot/Image
