name: Xiaomi 12 Lite Kernel Compiler (Official DTBO Fix)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev clang lld llvm device-tree-compiler

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Build Kernel Image and DTBO
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 1. Konfiguratsiyani yaratish
          make O=out taoyao_defconfig
          
          # 2. Asosiy yadro tasvirini yig'ish
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image
          
          # 3. Plata drayverlarini (DTB) kompilyatsiya qilish
          make -j$(nproc --all) O=out CC=clang LD=ld.lld dtbs
          
          # 4. GPU 710MHz jadvallarini o'z ichiga olgan haqiqiy dtbo.img tasvirini majburiy yig'ish
          make -j$(nproc --all) O=out CC=clang LD=ld.lld dtboimage

      - name: Upload Output Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-taoyao-fixed
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dtbo.img

