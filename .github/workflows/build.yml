name: Xiaomi 12 Lite GPU 700-812MHz + Audio Fix Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies (Direct Mirror)
        run: |
          echo "http://ubuntu.com" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache flex libelf-dev libssl-dev lz4 clang lld llvm device-tree-compiler

      - name: Clone Android 14 Kernel Source (Smart Fallback)
        run: |
          if git clone --depth=1 -b udc https://github.com kernel-src; then
            echo "MUVAFFAQIYATLI: Evolution-X Android 14 (udc) manbasi yuklandi!"
          elif git clone --depth=1 -b lineage-21.0 https://github.com kernel-src; then
            echo "MUVAFFAQIYATLI: SKGLab Android 14 (lineage-21.0) manbasi yuklandi!"
          else
            git clone --depth=1 -b lineage-23.2 https://github.com kernel-src
            echo "MUVAFFAQIYATLI: SKGLab asosiy manbasi yuklandi!"
          fi

      - name: Unlock Speed-Bin 0 (700MHz & 812MHz) & Audio Fix
        run: |
          cd kernel-src
          python3 -c '
          import glob, re
          unlocked = 0
          for path in glob.glob("drivers/gpu/msm/**/*.c", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              new_content = content
              if "qcom,speed-bin" in new_content:
                  new_content = re.sub(
                      r"(of_property_read_u32\([^;]+?\"qcom,speed-bin\"[^;]+?;)",
                      r"\1\n\t*speed_bin = 0;",
                      new_content
                  )
              if "adreno_read_speed_bin" in new_content:
                  new_content = re.sub(
                      r"(adreno_read_speed_bin\([^)]+\)\s*\{)",
                      r"\1\n\treturn 0;",
                      new_content
                  )
              if new_content != content:
                  with open(path, "w") as f:
                      f.write(new_content)
                  print("SPEED BIN UNLOCKED IN:", path)
                  unlocked += 1
          if unlocked == 0:
              print("ESLATMA: speed_bin funksiyasi topilmadi, fayl tuzilishini tekshirish kerak.")
          '

          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Final Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image

      - name: Upload Final Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu-unlocked-image
          path: kernel-src/out/arch/arm64/boot/Image
