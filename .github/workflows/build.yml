name: Taoyao GPU 670MHz Bin117-Safe + Audio Fix
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Minimal Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev lz4 clang lld llvm

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Patch GPU 550MHz to 670MHz (Bin 117 Safe) & Enable Audio
        run: |
          cd kernel-src
          # 1. DTB dan 550MHz (550000000) o'qilganda uni 670MHz (670000000) ga oshirish:
          python3 -c '
          import re
          with open("drivers/gpu/msm/adreno.c", "r") as f:
              text = f.read()

          new_text = re.sub(
              r"(of_property_read_u32\s*\([^,]+,\s*\"qcom,gpu-freq\"\s*,\s*&([^)]+)\)\s*;)",
              r"\1\n\t\tif (\2 == 550000000) \2 = 670000000;",
              text,
              flags=re.DOTALL
          )

          with open("drivers/gpu/msm/adreno.c", "w") as f:
              f.write(new_text)
          '
          git diff drivers/gpu/msm/adreno.c
          git diff --exit-code drivers/gpu/msm/adreno.c && exit 1 || echo "MUVAFFAQIYATLI: 550MHz -> 670MHz patchi tushdi!"

          # 2. Ovoz (Audio) va sensor mosligini to'liq yoqish
          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Final Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image

      - name: Upload Final Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu670-safe-audiofix
          path: kernel-src/out/arch/arm64/boot/Image
