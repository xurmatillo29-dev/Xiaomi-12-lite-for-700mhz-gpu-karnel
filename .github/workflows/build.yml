name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev clang lld llvm

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kernel_xiaomi_taoyao
          path: kernel-src

      - name: Build Kernel
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Aqlli qidiruv: taoyao so'zi bor defconfig faylini aniq manzilini topish
          TARGET_CONFIG=$(find arch/arm64/configs/ -name "*taoyao*" | head -n 1)
          
          if [ -z "$TARGET_CONFIG" ]; then
             echo "⚠️ DIQQAT: taoyao nomli fayl topilmadi! Bor fayllar ro'yxati:"
             find arch/arm64/configs/ -name "*defconfig*"
             exit 1
          fi
          
          # Topilgan fayl nomini (masalan: vendor/taoyao_defconfig) make buyrug'iga berish
          CONFIG_NAME=$(basename $TARGET_CONFIG)
          if [[ "$TARGET_CONFIG" == *"vendor/"* ]]; then
             CONFIG_NAME="vendor/$CONFIG_NAME"
          fi
          
          echo "✅ To'g'ri konfiguratsiya fayli topildi: $CONFIG_NAME"
          
          # Konfiguratsiyani sozlash
          make O=out $CONFIG_NAME
          
          # Kompilyatsiyani boshlash
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Upload Output (ZImage / Boot)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-taoyao
          path: kernel-src/out/arch/arm64/boot/Image*
