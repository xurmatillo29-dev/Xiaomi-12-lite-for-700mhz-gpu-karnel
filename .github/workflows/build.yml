name: Xiaomi 12 Lite GPU 710MHz + Audio Fix Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip unzip zlib1g-dev clang lld llvm device-tree-compiler python3

      - name: Checkout User Repo (for orig_dtbo.zip)
        uses: actions/checkout@v4

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Patch GPU 710MHz & Audio Compatibility
        run: |
          cd kernel-src
          grep -rl "550000000" arch/arm64/boot/dts/vendor/qcom/ | xargs sed -i 's/550000000/710000000/g'
          
          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Kernel and Merge DTBO
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image dtbs
          
          # Yadro ichidagi tayyor mkdtboimg.py skriptini topish
          MKDTBO_SCRIPT=$(find . -name "mkdtboimg.py" | head -n 1)
          
          cd ..
          unzip orig_dtbo.zip
          mkdir unpacked_dtbo
          python3 kernel-src/$MKDTBO_SCRIPT unpack dtbo.img -o unpacked_dtbo/dtbo
          cp kernel-src/out/arch/arm64/boot/dts/vendor/qcom/taoyao-sm7325-overlay.dtbo unpacked_dtbo/dtbo.0
          python3 kernel-src/$MKDTBO_SCRIPT create final_dtbo.img unpacked_dtbo/dtbo.*

      - name: Upload Final Overclocked & Audio Fixed Files
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu710-audiofix
          path: |
            kernel-src/out/arch/arm64/boot/Image
            final_dtbo.img
