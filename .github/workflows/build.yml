name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kernel_xiaomi_taoyao
          path: kernel-src

      - name: Download Google Official Clang
        run: |
          mkdir clang-src
          cd clang-src
          curl -LO https://googlesource.com
          tar -xf clang-r450784d.tar.gz
          rm -f clang-r450784d.tar.gz

      - name: Build Kernel
        run: |
          cd kernel-src
          export PATH=$GITHUB_WORKSPACE/clang-src/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Output (ZImage / Boot)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-taoyao
          path: kernel-src/out/arch/arm64/boot/Image*
