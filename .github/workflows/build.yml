name: Taoyao GPU 700-812MHz + Full Modules Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Minimal Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev lz4 clang lld llvm

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Patch GPU Speed-Bin 0 & Module Compatibility
        run: |
          cd kernel-src
          grep -rn -C 3 "speed-bin" drivers/gpu/msm/
          sed -i 's/adreno_read_speed_bin(adreno_dev);/0;/g' drivers/gpu/msm/adreno.c
          sed -i 's/of_property_read_u32(.*\"qcom,speed-bin\".*);/& speed_bin = 0;/g' drivers/gpu/msm/adreno.c
          git diff drivers/gpu/msm/
          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS

      - name: Build Kernel Image & Modules
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image modules
          make O=out CC=clang LD=ld.lld STRIP=llvm-strip INSTALL_MOD_PATH=../mod_out INSTALL_MOD_STRIP=1 modules_install
          mkdir -p ../final_modules
          find ../mod_out -name "*.ko" -exec cp {} ../final_modules/ \;
          ls -lh ../final_modules/ | head -n 30

      - name: Upload Image and Kernel Modules
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu812-with-modules
          path: |
            kernel-src/out/arch/arm64/boot/Image
            final_modules/*.ko
