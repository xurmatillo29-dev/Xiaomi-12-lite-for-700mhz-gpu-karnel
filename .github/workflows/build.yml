name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev

      - name: Clone Kernel Source
        env:
          REPO: "https://github.com"
        run: git clone --depth=1 -b lineage-23.2 $REPO kernel-src

      - name: Clone Toolchains (Clang)
        env:
          URL: "https://gitlab.com"
        run: git clone --depth=1 $URL $HOME/clang

      - name: Build Kernel
        run: |
          cd kernel-src
          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Output (ZImage / Boot)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-taoyao
          path: kernel-src/out/arch/arm64/boot/Image*
