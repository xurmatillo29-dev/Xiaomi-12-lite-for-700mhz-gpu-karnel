name: Taoyao Android 14 GPU 670MHz AnyKernel3 Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev lz4 clang lld llvm python3 cpio zip unzip

      - name: Clone Kernel Source (Android 14 / lineage-21)
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-21
          path: kernel-src

      - name: Patch GPU Frequency to 670MHz in Device Tree
        run: |
          cd kernel-src
          GPU_DTSI=$(find arch/arm64/boot/dts/ -name "*yupik*gpu*.dtsi" | head -n 1)
          echo "Found GPU DTSI: $GPU_DTSI"
          # 550MHz / 563MHz ni 670MHz ga o'zgartirish va kuchlanishni TURBO_L1 qilish
          sed -i 's/550000000/670000000/g' "$GPU_DTSI"
          sed -i 's/563000000/670000000/g' "$GPU_DTSI"
          git diff arch/arm64/boot/dts/

      - name: Build Kernel Image, DTBs and Modules
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image dtbs modules

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3
          cd AnyKernel3
          # AnyKernel3 sozlamalarini taoyao uchun moslash
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          
          cp ../kernel-src/out/arch/arm64/boot/Image .
          find ../kernel-src/out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > dtb
          if [ -f ../kernel-src/out/arch/arm64/boot/dtbo.img ]; then
            cp ../kernel-src/out/arch/arm64/boot/dtbo.img .
          fi
          
          rm -rf .git README.md
          zip -r9 ../Taoyao-A14-GPU670-Kernel.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Taoyao-A14-GPU670-Kernel
          path: Taoyao-A14-GPU670-Kernel.zip
