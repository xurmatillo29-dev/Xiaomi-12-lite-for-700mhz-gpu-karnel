name: Xiaomi 12 Lite EvolutionX Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev clang lld llvm device-tree-compiler

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Paimon-Lab/kernel_xiaomi_taoyao
          ref: fourteen
          path: kernel-src

      - name: Build Kernel Image and DTBO
        run: |
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Konfiguratsiyani yaratish
          make O=out taoyao_defconfig
          
          # Yadro va proshivkaga mos drayverlarni (dtbs) to'liq yig'ish
          make -j$(nproc --all) O=out CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip Image dtbs

      - name: Upload Output Kernel Files
        uses: actions/upload-artifact@v4
        with:
          name: compiled-evolutionx-kernel
          path: |
            kernel-src/out/arch/arm64/boot/Image
            kernel-src/out/arch/arm64/boot/dts/vendor/qcom/taoyao-sm7325-overlay.dtbo

