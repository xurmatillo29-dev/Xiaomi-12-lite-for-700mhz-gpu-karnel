name: Xiaomi 12 Lite GPU 700-812MHz + Audio Fix Builder
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Official LineageOS AOSP Clang (New)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r487747c
          path: clang

      - name: Clone Official LineageOS AArch64 Binutils
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          path: gcc64

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: skglab-dev/kernel_xiaomi_taoyao
          ref: lineage-23.2
          path: kernel-src

      - name: Unlock Speed-Bin 0 (700MHz & 812MHz) & Audio Fix
        run: |
          cd kernel-src
          python3 -c '
          import glob, re
          unlocked = 0
          for path in glob.glob("drivers/gpu/msm/**/*.c", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              new_content = content
              if "qcom,speed-bin" in new_content:
                  new_content = re.sub(
                      r"(of_property_read_u32\([^;]+?\"qcom,speed-bin\"[^;]+?;)",
                      r"\1\n\t*speed_bin = 0;",
                      new_content
                  )
              if "adreno_read_speed_bin" in new_content:
                  new_content = re.sub(
                      r"(adreno_read_speed_bin\([^)]+\)\s*\{)",
                      r"\1\n\treturn 0;",
                      new_content
                  )
              if new_content != content:
                  with open(path, "w") as f:
                      f.write(new_content)
                  print("SPEED BIN UNLOCKED IN:", path)
                  unlocked += 1
          if unlocked == 0:
              print("ESLATMA: speed_bin funksiyasi topilmadi!")
          '

          scripts/config --file arch/arm64/configs/taoyao_defconfig \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_SOUND \
            --enable CONFIG_SND \
            --enable CONFIG_SND_SOC \
            --enable CONFIG_SND_SOC_WCD938X \
            --enable CONFIG_SND_SOC_WSA883X \
            --enable CONFIG_PINCTRL_LPI \
            --enable CONFIG_SND_SOC_LPASS_CDC

      - name: Build Final Kernel Image
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          cd kernel-src
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out taoyao_defconfig
          make -j$(nproc --all) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LD=ld.lld \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Upload Final Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: taoyao-gpu700-812-audiofix
          path: kernel-src/out/arch/arm64/boot/Image
