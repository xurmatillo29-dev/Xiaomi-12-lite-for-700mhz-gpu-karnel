name: Xiaomi 12 Lite Kernel Compiler
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libssl-dev libpcre2-dev lz4 make openjdk-11-jdk rsync liblz4-tool zip zlib1g-dev clang lld llvm

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kernel_xiaomi_taoyao
          path: kernel-src
          fetch-depth: 0 # Barcha tarmoqlarni (branch) tekshirish uchun to'liq yuklash

      - name: Build Kernel
        run: |
          cd kernel-src
          
          echo "============================================="
          echo "📂 REPOZITORIYa ICHIDAGI ASOSIYa PAPKALAR:"
          ls -la
          echo "============================================="
          echo "🌿 MAVJUD TARMOQLAR (BRANCHES) RO'YXATI:"
          git branch -a
          echo "============================================="
          
          # Agarda arch papkasi topilsa, configs ichini qidirish
          if [ -d "arch/arm64/configs" ]; then
            echo "✅ Configs papkasi topildi! Fayllar:"
            find arch/arm64/configs/ -name "*defconfig*"
          else
            echo "❌ arch/arm64/configs papkasi umuman yo'q!"
            echo "Qidirilmoqda: istalgan defconfig fayli..."
            find . -name "*defconfig*"
          fi
          exit 1 # Loglarni ko'rishimiz uchun jarayonni ataylab shu yerda to'xtatamiz

